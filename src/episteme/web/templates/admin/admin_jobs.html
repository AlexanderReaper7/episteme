{% extends "admin/admin_base.html" %}

{% block title %} • Job queue{% endblock %}

{% block admin_content %}
<h1 class="admin-title">Job queue</h1>

<section class="admin-card admin-card-wide">
  <h2>Controls</h2>
  {% include "admin/_job_controls.html" %}
  <p class="stage-controls">
    <input id="stage-limit" name="limit" type="number" min="1" placeholder="limit">
    <input id="stage-story" name="story_id" type="number" min="1" placeholder="story id">
    <input id="stage-post" name="post_id" type="number" min="1" placeholder="post id">
    <button hx-post="/admin/defer/embed" hx-include="#stage-limit" hx-target="#queue" hx-swap="innerHTML">embed</button>
    <button hx-post="/admin/defer/cluster" hx-include="#stage-limit" hx-target="#queue" hx-swap="innerHTML">cluster</button>
    <button hx-post="/admin/defer/triage" hx-include="#stage-limit,#stage-story" hx-target="#queue" hx-swap="innerHTML">triage</button>
    <button hx-post="/admin/defer/write" hx-include="#stage-limit,#stage-story" hx-target="#queue" hx-swap="innerHTML">write</button>
    <button hx-post="/admin/defer/qa" hx-include="#stage-limit,#stage-post" hx-target="#queue" hx-swap="innerHTML">qa</button>
  </p>
</section>

<section class="admin-card admin-card-wide">
  <h2>Queue</h2>
  <div id="queue" hx-get="/admin/partials/queue"
       hx-trigger="every 10s, refreshQueue from:body"
       hx-target="this">
    {% include "admin/_admin_queue.html" %}
  </div>
</section>
{% endblock %}
