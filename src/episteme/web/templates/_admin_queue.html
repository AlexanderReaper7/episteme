<table class="admin-table">
  <tr><th>#</th><th>task</th><th>status</th><th>attempts</th><th>scheduled</th></tr>
  {% for job in jobs %}
  <tr>
    <td>{{ job.id }}</td>
    <td class="mono">{{ job.task_name }}</td>
    <td class="{{ 'ok' if job.status == 'succeeded' else ('bad' if job.status == 'failed' else '') }}">{{ job.status }}</td>
    <td>{{ job.attempts }}</td>
    <td>{{ job.scheduled_at | dt }}</td>
  </tr>
  {% else %}
  <tr><td colspan="5" class="mono">queue empty</td></tr>
  {% endfor %}
</table>
