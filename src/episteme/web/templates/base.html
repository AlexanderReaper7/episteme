<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Episteme{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- Vendored htmx preferred; falls back to CDN until static/htmx.min.js exists. -->
  <script src="/static/htmx.min.js"
          onerror="var s=document.createElement('script');s.src='https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js';document.head.appendChild(s);"></script>
</head>
<body>
  <header class="site-header">
    <h1><a href="/">Episteme</a></h1>
    <nav class="site-nav">
      <a href="/admin">Admin</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
