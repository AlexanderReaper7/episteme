services:
  db:
    image: pgvector/pgvector:pg18
    # zstd-compress full-page images in the WAL (no zstd for table data;
    # large text columns are TOAST/pglz-compressed automatically).
    command: postgres -c wal_compression=zstd
    environment:
      POSTGRES_USER: episteme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-episteme}
      POSTGRES_DB: episteme
    # Published for host tools (pgAdmin etc.), localhost-only. 5433 because the
    # host already has something on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    # PG18 images moved the volume mount from /var/lib/postgresql/data to
    # /var/lib/postgresql (PGDATA lives at <mount>/18/docker).
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U episteme -d episteme"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: brings the schema to head (Alembic), applies the procrastinate
  # job-queue schema, seeds sources. Idempotent; re-runs on every `up`.
  #
  # It refuses to apply any revision still marked UNREVIEWED, and dumps the
  # database before applying anything to a non-empty one — so this failing is a
  # normal, informative outcome, not a broken stack. Read its logs.
  migrate:
    build: .
    command: python -m episteme.bootstrap
    environment: &env
      DATABASE_URL: postgresql://episteme:${POSTGRES_PASSWORD:-episteme}@db:5432/episteme
    # Same bind-mount as the worker: pre-migration dumps land beside the regular
    # backups, on the host, outside the pgdata volume.
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: uvicorn episteme.web.app:app --host 0.0.0.0 --port 8200
    init: true
    environment: *env
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: procrastinate --app=episteme.worker.app.app worker
    # init reaps zombie processes left by crashed Chromium subprocesses
    # (Playwright in the QA stage); the python worker as PID 1 won't.
    init: true
    environment: *env
    # Nightly pg_dump (--compress=zstd) lands here; bind-mounted to the host so the
    # dumps survive the pgdata volume and can be copied offsite. Point BACKUP_DIR at
    # the location of your choice.
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
