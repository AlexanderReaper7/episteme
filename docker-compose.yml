services:
  db:
    image: pgvector/pgvector:pg18
    # zstd-compress full-page images in the WAL (no zstd for table data;
    # large text columns are TOAST/pglz-compressed automatically).
    command: postgres -c wal_compression=zstd
    environment:
      POSTGRES_USER: episteme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-episteme}
      POSTGRES_DB: episteme
    # Published for host tools (pgAdmin etc.), localhost-only. 5433 because the
    # host already has something on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U episteme -d episteme"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # One-shot: brings the schema to head (Alembic), applies the procrastinate
  # job-queue schema, seeds sources. Idempotent; re-runs on every `up`.
  #
  # It refuses to apply any revision still marked UNREVIEWED, and dumps the
  # database before applying anything to a non-empty one — so this failing is a
  # normal, informative outcome, not a broken stack. Read its logs.
  migrate:
    build: .
    command: python -m episteme.bootstrap
    environment: &env
      DATABASE_URL: postgresql://episteme:${POSTGRES_PASSWORD:-episteme}@db:5432/episteme
      # Contact address sent in the crawler's User-Agent; empty sends none.
      HTTP_CONTACT: ${HTTP_CONTACT:-}
      # Fish Audio TTS (narrate stage). Key + voice live in the host .env; empty
      # defaults keep the stage a safe no-op until configured. TTS_ENABLED gates
      # the nightly run — deferring narrate manually works regardless.
      FISH_API_KEY: ${FISH_API_KEY:-}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-}
      TTS_OPUS_BITRATE: ${TTS_OPUS_BITRATE:-64000}
      # llama-warden's API (run on the host outside compose: it is what starts
      # llama.cpp, so it cannot share this lifecycle). Empty disables the backend
      # panel and the sweep. InferMux does not serve this API (0058). The pause
      # needs no URL here: the warden pushes it to /api/pipeline/announce (0057).
      LLM_WARDEN_URL: ${LLM_WARDEN_URL:-}
      # The key InferMux knows each process by (0058). web and worker mount
      # different keys here, and InferMux reads the class from the key.
      LLM_API_KEY_FILE: /run/secrets/infermux-key
      # Notifications (ntfy, 0056). Empty NTFY_BASE_URL is the off switch: the
      # digest and the lunch push return before building a message. The topics
      # are separate so lunch can be muted without muting the digest, and
      # PUBLIC_BASE_URL is the address the PHONE opens, never web:8200.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_TOPIC_DIGEST: ${NTFY_TOPIC_DIGEST:-episteme}
      NTFY_TOPIC_LUNCH: ${NTFY_TOPIC_LUNCH:-episteme}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    # Same bind-mount as the worker: pre-migration dumps land beside the regular
    # backups, on the host, outside the pgdata volume.
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    # --reload-dir scopes the watcher to source only (default watches the cwd,
    # which would include .venv baked into the image).
    #
    # --timeout-graceful-shutdown is not a tuning knob, it is what makes reload
    # terminate at all. Uvicorn waits for open connections to close, and an SSE
    # stream never closes on its own: the admin log pane (0034) and every chat
    # turn (0038) hold one. Without the cap, a source edit wedges the container
    # in "Waiting for connections to close" until it is killed by hand, and every
    # request in the meantime hangs rather than failing. (Watched 2026-08-12.)
    command: >
      uvicorn episteme.web.app:app --host 0.0.0.0 --port 8200
      --reload --reload-dir src --timeout-graceful-shutdown 5
    init: true
    environment: *env
    # Docker on Linux defines host.docker.internal only when asked, and every
    # host service this talks to (InferMux, ntfy) is addressed by that name.
    extra_hosts:
      - host.docker.internal:host-gateway
    # Bind-mount source over the baked-in copy so edits reload without a rebuild.
    volumes:
      - ./src:/app/src
      # Narration MP3s (written by the worker's narrate stage) served at /media.
      - ${AUDIO_DIR:-./media}:/media
    ports:
      - "127.0.0.1:8200:8200"
    # Interactive: the reader is waiting on every call the web makes.
    secrets:
      - source: infermux-web
        target: infermux-key
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health runs a `SELECT 1`, so this covers uvicorn being up AND the DB
      # reachable. curl is already in the image (PGDG key fetch).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8200/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_interval: 20s
      start_period: 3s
    restart: unless-stopped

  worker:
    build: .
    command: procrastinate --app=episteme.worker.app.app worker
    # Batch, including the jobs the reader deferred from the web (0058).
    secrets:
      - source: infermux-worker
        target: infermux-key
    # init reaps zombie processes left by crashed Chromium subprocesses
    # (Playwright in the QA stage); the python worker as PID 1 won't.
    init: true
    environment: *env
    # Docker on Linux defines host.docker.internal only when asked, and every
    # host service this talks to (InferMux, ntfy) is addressed by that name.
    extra_hosts:
      - host.docker.internal:host-gateway
    # Nightly pg_dump (--compress=zstd) lands here; bind-mounted to the host so the
    # dumps survive the pgdata volume and can be copied offsite. Point BACKUP_DIR at
    # the location of your choice.
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      # Narration MP3s the narrate stage writes; same host dir the web serves.
      - ${AUDIO_DIR:-./media}:/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker has no HTTP port; procrastinate's built-in healthchecks command
      # verifies it can reach the Postgres-backed job queue (the worker's one hard
      # dependency) and that the schema is applied. Exits non-zero on failure.
      test: ["CMD-SHELL", "procrastinate --app=episteme.worker.app.app healthchecks || exit 1"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 30s
    restart: unless-stopped

volumes:
  pgdata:

networks:
  default:
    # A fixed bridge name, so a host firewall can open a port to these
    # containers alone. The NixOS host opens InferMux's :5001 on it (nixcfg,
    # modules/nixos/llm.nix).
    driver_opts:
      com.docker.network.bridge.name: br-episteme

# sops-nix decrypts these on the NixOS host (nixcfg, modules/nixos/llm.nix).
secrets:
  infermux-web:
    file: ${INFERMUX_KEY_WEB:-/run/secrets/episteme}
  infermux-worker:
    file: ${INFERMUX_KEY_WORKER:-/run/secrets/episteme-batch}
