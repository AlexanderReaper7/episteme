# Convenience config for running the bare `alembic` CLI from the repo root during
# development. Everything the application itself does goes through
# `episteme.migrations.alembic_config()` instead, which resolves the same paths
# from the installed package (see that module's docstring).
#
# The database URL is intentionally absent: env.py reads it from episteme.config
# settings, so there is one source of truth and no `%`-escaping hazard.
#
# Note that `alembic upgrade` is gated on the UNREVIEWED markers regardless of
# how it is invoked — the check lives in env.py. See episteme/migrations/guard.py.

[alembic]
script_location = src/episteme/migrations
version_locations = src/episteme/migrations/versions
path_separator = os
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
