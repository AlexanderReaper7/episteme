[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "episteme"
version = "0.1.0"
description = "Self-hosted, LLM-powered personalized science newsfeed"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "jinja2>=3.1",
    # Renders a single named Jinja block (with full inheritance) for htmx fragment
    # responses — see web/templating.py:render. Pure-Python, only depends on jinja2.
    "jinja2-fragments>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.18",
    "asyncpg>=0.31",
    "pgvector>=0.5",
    "procrastinate>=3.9",
    "psycopg[binary]>=3.3",
    "feedparser>=6.0",
    "trafilatura>=2.1",
    "lxml>=6.0",
    "httpx>=0.27",
    "curl_cffi>=0.15",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "markdown>=3.10",
    "nh3>=0.3",
    # Starlette form parsing (request.form()) for the admin POST forms.
    "python-multipart>=0.0.20",
    "playwright>=1.61",
    "starlette-compress>=1.8",
    "fish-audio-sdk>=1.3.0",
    # Streaming TTS frames the Fish live WebSocket protocol directly (the SDK's
    # TTSRequest can't request opus); these back that and are already pulled in
    # transitively by fish-audio-sdk — declared here because we import them.
    "httpx-ws>=0.7",
    "ormsgpack>=1.5",
    # zoneinfo needs an IANA tz database; Windows ships none, so the display_timezone
    # lookup (web/templating.py) would raise there without this. Linux images have a
    # system db, but pinning it keeps dev (Windows) and container behaviour identical.
    "tzdata>=2025.1",
]

[dependency-groups]
# Dev tooling lives in a uv dependency group (not project.optional-dependencies):
# `uv sync` installs it by default for local work, and the Dockerfile excludes it
# with `uv sync --no-dev`.
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"episteme.web" = ["templates/*.html", "static/*"]
# Migrations ship inside the package so the Docker image's `COPY src ./src` picks
# them up and `script_location` resolves the same way in the container as it does
# from an editable install (see episteme.migrations.alembic_config).
"episteme.migrations" = ["*.mako", "versions/*.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
