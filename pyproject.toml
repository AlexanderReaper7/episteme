[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "episteme"
version = "0.1.0"
description = "Self-hosted, LLM-powered personalized science newsfeed"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.18",
    "asyncpg>=0.31",
    "pgvector>=0.5",
    "procrastinate>=3.9",
    "psycopg[binary]>=3.3",
    "feedparser>=6.0",
    "trafilatura>=2.1",
    "lxml>=6.0",
    "httpx>=0.27",
    "curl_cffi>=0.15",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "markdown>=3.10",
    "nh3>=0.3",
    "playwright>=1.61",
    "starlette-compress>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"episteme.web" = ["templates/*.html", "static/*"]
# Migrations ship inside the package so the Docker image's `COPY src ./src` picks
# them up and `script_location` resolves the same way in the container as it does
# from an editable install (see episteme.migrations.alembic_config).
"episteme.migrations" = ["*.mako", "versions/*.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
