[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "episteme"
version = "0.1.0"
description = "Self-hosted, LLM-powered personalized science newsfeed"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "procrastinate>=3.0",
    "psycopg[binary]>=3.2",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"episteme.web" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
